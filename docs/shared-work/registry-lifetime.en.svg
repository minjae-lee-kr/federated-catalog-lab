<svg xmlns="http://www.w3.org/2000/svg" width="480" height="612" viewBox="0 0 480 612" role="img" aria-labelledby="title description">
  <title id="title">F2 keeps running after F1's cleanup</title>
  <desc id="description">Recorded state after event 20 in two replacement traces. F1 settled at event 18 and returned its slot at event 19. F2 is still running with C waiting in both cases. Unconditional cleanup removes F2's registry entry; D then starts F3 at event 22 and joins it at event 23. Identity-checked cleanup keeps F2 registered; D joins F2 at event 22. These are state comparisons, not a duration scale.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { fill: #17324e; font-size: 25px; font-weight: 650; }
    .policy { fill: #17324e; font-size: 22px; font-weight: 650; }
    .label { fill: #52657a; font-size: 18px; }
    .value { fill: #243b53; font-size: 25px; font-weight: 600; }
    .flight { fill: #214f9b; font-size: 23px; font-weight: 650; }
    .waiter { fill: #365a85; font-size: 18px; }
    .decision { fill: #17324e; font-size: 28px; font-weight: 650; }
    .event { fill: #52657a; font-size: 17px; }
  </style>
  <rect width="480" height="612" rx="12" fill="#ffffff"/>
  <text class="title" x="20" y="34">After F1's cleanup · #20</text>
  <text class="event" x="20" y="62">F1 settled #18 · slot returned #19</text>

  <g>
    <rect x="16" y="86" width="448" height="224" rx="14" fill="#f5f8fc" stroke="#d6e0ee"/>
    <text class="policy" x="36" y="118">Unconditional cleanup</text>
    <text class="label" x="36" y="150">Registry</text>
    <text class="label" x="214" y="150">Physical work</text>
    <rect x="36" y="164" width="154" height="68" rx="8" fill="#ffffff" stroke="#95a7be" stroke-dasharray="5 4"/>
    <text class="value" x="55" y="206">None</text>
    <rect x="214" y="164" width="230" height="68" rx="8" fill="#eaf2ff" stroke="#638bc7"/>
    <text class="flight" x="230" y="192">F2 · running</text>
    <text class="waiter" x="230" y="218">C waiting</text>
    <text class="decision" x="36" y="278">D → F3</text>
    <text class="event" x="205" y="276">#22 start · #23 join</text>
  </g>

  <g>
    <rect x="16" y="334" width="448" height="224" rx="14" fill="#f5f8fc" stroke="#d6e0ee"/>
    <text class="policy" x="36" y="366">Identity-checked cleanup</text>
    <text class="label" x="36" y="398">Registry</text>
    <text class="label" x="214" y="398">Physical work</text>
    <rect x="36" y="412" width="154" height="68" rx="8" fill="#ffffff" stroke="#638bc7"/>
    <text class="value" x="55" y="454">F2</text>
    <rect x="214" y="412" width="230" height="68" rx="8" fill="#eaf2ff" stroke="#638bc7"/>
    <text class="flight" x="230" y="440">F2 · running</text>
    <text class="waiter" x="230" y="466">C waiting</text>
    <text class="decision" x="36" y="526">D → F2</text>
    <text class="event" x="205" y="524">#22 joins existing F2</text>
  </g>
  <text x="20" y="593" fill="#243b53" font-size="20" font-weight="550">F2 is still running in both states.</text>
</svg>
